# Broker MQTT (Mosquitto) y base de datos (MongoDB), propios del proyecto (no se usa un broker público).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]            # abierto a la red local para que el ESP32 pueda conectarse
    volumes:
      - ./mosquitto:/mosquitto/config:ro   # mosquitto.conf, passwd y acl
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]  # solo accesible desde esta computadora
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
volumes:
  mosquitto_data:
  mongo_data:
