<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de bomba de agua</title>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="flex flex-wrap items-center justify-between gap-2 p-4 border-b border-slate-700">
    <h1 class="text-xl font-bold">Monitor de bomba de agua</h1>
    <div class="flex gap-2 text-sm">
      <span id="modo" class="px-2 py-1 rounded bg-slate-700">sin datos</span>
      <span id="conexion" class="px-2 py-1 rounded bg-slate-700">conectando…</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-6">
    <!-- Estado actual -->
    <section id="estado" class="rounded-lg p-4 text-center text-2xl font-bold bg-slate-700">Esperando datos…</section>

    <!-- Variables medidas -->
    <section>
      <h2 class="font-semibold mb-2">Variables medidas</h2>
      <div id="variables" class="grid gap-3 sm:grid-cols-3"></div>
    </section>

    <!-- Resultado de cada detector -->
    <section>
      <h2 class="font-semibold mb-2">Resultado de los detectores</h2>
      <div id="detectores" class="grid gap-3 sm:grid-cols-3"></div>
    </section>

    <!-- Alertas en vivo -->
    <section>
      <h2 class="font-semibold mb-2">Alertas</h2>
      <ul id="alertas" class="space-y-1 text-sm"><li class="text-slate-400">Sin alertas todavía.</li></ul>
    </section>

    <!-- Historial guardado en MongoDB -->
    <section>
      <h2 class="font-semibold mb-2">Historial</h2>
      <div class="flex flex-wrap gap-2 mb-3">
        <select id="corridas" class="bg-slate-800 border border-slate-600 rounded p-2"></select>
        <button id="recargar" class="bg-blue-600 hover:bg-blue-500 rounded px-3 py-2">Recargar</button>
      </div>
      <h3 class="text-sm text-slate-300 mb-1">Eventos anómalos de la corrida</h3>
      <ul id="hist-anomalias" class="space-y-1 text-sm mb-4"></ul>
      <h3 class="text-sm text-slate-300 mb-1">Últimas mediciones de la corrida</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="text-slate-400"><tr><th class="pr-3">Hora</th><th class="pr-3">Temp (°C)</th><th class="pr-3">Humedad (%HR)</th><th class="pr-3">Caudal (L/min)</th><th>Alertas</th></tr></thead>
          <tbody id="hist-tabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
